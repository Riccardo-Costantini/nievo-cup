<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Nievo Cup – Pannello Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="shortcut icon" href="assets/images/loghi/favicon_nievo_cup.ico" type="image/x-icon">
</head>
<body class="page-admin">

<div id="bg-fx" aria-hidden="true"></div>

<div class="wrap-admin" style="visibility:hidden">
  <header class="admin-hdr-bar">
    <div class="brand">
      <div class="brand-logo-admin">⚽</div>
      <div>
        <div class="brand-name-admin">NIEVO CUP</div>
        <div class="brand-sub-admin">Admin Panel</div>
      </div>
    </div>
    <div class="hdr-badges">
      <div class="fb-badge" id="fb-badge">
        <div class="fb-dot" id="fb-dot"></div>
        <span id="fb-lbl">Non connesso</span>
      </div>
      <div class="live-pill-admin">
        <div class="pulse-dot"></div>
        Real-time
      </div>
    </div>
  </header>

  <div class="admin-panel">
    <div class="adm-hdr">
      <div class="adm-ico">🛠️</div>
      <div>
        <div class="adm-title">Gestione Live</div>
        <div class="adm-sub">Nievo Cup · Aggiornamenti istantanei</div>
      </div>
    </div>

    <div class="fg">
      <label class="fl" for="adm-match">📋 SELEZIONA PARTITA</label>
      <select id="adm-match">
        <option value="">— Caricamento in corso —</option>
      </select>
    </div>

    <div class="score-box">
      <div class="sb-match" id="adm-mlbl">⚡ Nessuna partita selezionata</div>
      <div class="sb-score" id="adm-score">0 : 0</div>
      <div class="sb-status" id="adm-stato">–</div>
    </div>

    <div class="fg">
      <label class="fl" for="adm-status">⏱ STATO PARTITA</label>
      <select id="adm-status">
        <option value="In programma">In programma</option>
        <option value="Live">🔴 LIVE</option>
        <option value="Finita">🏁 FINITA</option>
      </select>
    </div>

    <hr class="div" />

    <div class="fg">
      <label class="fl">⚡ SQUADRA MARCATRICE</label>
      <div class="team-tog">
        <button class="tog-btn active" id="btn-h" data-team="home">🏠 Casa</button>
        <button class="tog-btn" id="btn-a" data-team="away">✈️ Trasferta</button>
      </div>
    </div>

    <div class="fg">
      <label class="fl" for="scorer-in">👤 NOME MARCATORE</label>
      <input type="text" id="scorer-in" placeholder="Es. M. Rossi, Autogol" autocomplete="off" maxlength="40" />
    </div>

    <button class="btn btn-primary" id="addGoalBtn">⚽ AGGIUNGI GOAL</button>
    <button class="btn btn-amber" id="undoGoalBtn">↩️ ANNULLA ULTIMO GOAL</button>

    <hr class="div" />

    <button class="btn btn-red" id="resetMatchBtn">🔄 RESET PARTITA</button>

    <hr class="div" />
    <div class="adm-sub adm-sub-create">➕ CREA NUOVA PARTITA</div>
    <div class="fg"><input type="text" id="newMatchId" placeholder="ID (es. m61)" maxlength="4" autocomplete="off" /></div>
    <div class="fg"><input type="date" id="newMatchDate" /></div>
    <div class="fg"><input type="text" id="newMatchTime" placeholder="Orario (es. 20:10)" maxlength="5" autocomplete="off" /></div>
    <div class="fg"><input type="text" id="newHomeName" placeholder="Squadra casa" maxlength="40" autocomplete="off" /></div>
    <div class="fg"><input type="text" id="newAwayName" placeholder="Squadra trasferta" maxlength="40" autocomplete="off" /></div>
    <button class="btn btn-primary" id="createMatchBtn">➕ CREA</button>

    <hr class="div" />
    <button class="btn btn-amber" id="logoutBtn">🚪 ESCI (LOGOUT)</button>
  </div>

  <footer class="admin-footer">Nievo Cup · Pannello Amministrazione · Firebase Realtime DB</footer>
</div>

<div id="toast" class="admin-toast"></div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { initializeAppCheck, ReCaptchaEnterpriseProvider } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js';
  import { getDatabase, ref, onValue, set, runTransaction } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
  import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyB0LUxAWKVUIhXYRb2T2JOT3ypiX9q_5Ck",
    authDomain: "nievo-fcc94.firebaseapp.com",
    databaseURL: "https://nievo-fcc94-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "nievo-fcc94",
    storageBucket: "nievo-fcc94.firebasestorage.app",
    messagingSenderId: "497831212426",
    appId: "1:497831212426:web:357e8c37b249042c53c473",
  };

  const app = initializeApp(firebaseConfig);

  // Firebase App Check: attesta che le richieste arrivino dal sito reale
  initializeAppCheck(app, {
    provider: new ReCaptchaEnterpriseProvider('6LcRi8wtAAAAAEtHZHqZr_AFPd4NCVO9jWPwQ2MM'),
    isTokenAutoRefreshEnabled: true
  });

  const auth = getAuth(app);
  auth.onAuthStateChanged((user) => {
  if (user) {
    console.log("EMAIL:", user.email);
    console.log("EMAIL VERIFICATA:", user.emailVerified);
  }
});
  let db = null;
  let matchesData = {};
  let resultsData = {};
  let selMatchId = '';
  let selTeam = 'home';

  function toArray(val) {
    if (!val) return [];
    if (Array.isArray(val)) return val;
    if (typeof val === 'object') return Object.values(val);
    return [];
  }

  function extractMatchNumber(id) {
    const match = id.match(/m(\d+)/i);
    return match ? parseInt(match[1], 10) : 0;
  }

  function getCombinedState(matchId) {
    const match = matchesData[matchId];
    const result = resultsData[matchId] || {};
    return {
      homeName: match?.home?.name || '?',
      awayName: match?.away?.name || '?',
      scorersHome: toArray(result.scorersHome),
      scorersAway: toArray(result.scorersAway),
      status: result.status || 'In programma'
    };
  }

  async function writeResult(matchId, data) {
    if (!db) throw new Error('DB non connesso');
    const resultRef = ref(db, `liveResults/${matchId}`);
    await set(resultRef, { ...data, updatedAt: Date.now() });
  }

  // Rimuove caratteri di controllo e < >, limita la lunghezza
  const clean = (v, max) => String(v === null || v === undefined ? '' : v).replace(/[\u0000-\u001F\u007F<>]/g, '').trim().slice(0, max);

  // Aggiornamento atomico: legge il valore piu' recente dal server e applica la modifica,
  // cosi' due operatori contemporanei non si sovrascrivono i gol a vicenda.
  async function updateResult(matchId, mutator) {
    if (!db) throw new Error('DB non connesso');
    return runTransaction(ref(db, `liveResults/${matchId}`), (current) => {
      const base = (current && typeof current === 'object') ? current : {};
      const next = mutator({
        scorersHome: toArray(base.scorersHome),
        scorersAway: toArray(base.scorersAway),
        status: base.status || 'In programma'
      });
      if (!next) return; // annulla la transazione
      return { ...next, updatedAt: Date.now() };
    });
  }

  function reportError(err) {
    console.error(err);
    const denied = (err && err.code === 'PERMISSION_DENIED') || /permission_denied/i.test(String(err && err.message));
    showToast(denied ? 'Permesso negato: scrittura non autorizzata' : 'Errore di salvataggio, riprova', 'err');
  }

  // Evita doppi invii (es. doppio tap su "Aggiungi goal")
  let busy = false;
  async function runExclusive(fn) {
    if (busy) return;
    busy = true;
    try { await fn(); } catch (err) { reportError(err); } finally { busy = false; }
  }

  function setConnected(on) {
    const badge = document.getElementById('fb-badge');
    const dot = document.getElementById('fb-dot');
    const lbl = document.getElementById('fb-lbl');
    if (on) {
      badge.classList.add('ok');
      dot.style.background = 'var(--live)';
      lbl.textContent = 'Firebase connesso';
    } else {
      badge.classList.remove('ok');
      dot.style.background = 'var(--text-3)';
      lbl.textContent = 'Non connesso';
    }
  }

  function showToast(msg, type = 'inf') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `admin-toast show t-${type}`;
    setTimeout(() => el.className = 'admin-toast', 3200);
  }

  function updateAdminPreview() {
    const mlbl = document.getElementById('adm-mlbl');
    const score = document.getElementById('adm-score');
    const stato = document.getElementById('adm-stato');

    if (!selMatchId || !matchesData[selMatchId]) {
      mlbl.textContent = '⚡ Nessuna partita selezionata';
      score.textContent = '— : —';
      stato.textContent = '–';
      return;
    }
    const state = getCombinedState(selMatchId);
    mlbl.textContent = `${state.homeName} VS ${state.awayName}`;
    score.textContent = `${state.scorersHome.length} : ${state.scorersAway.length}`;
    stato.textContent = state.status === 'Live' ? '🔴 LIVE' : (state.status === 'Finita' ? '🏁 FINITA' : '⚪ IN PROGRAMMA');
    
    const statusSelect = document.getElementById('adm-status');
    for (let i = 0; i < statusSelect.options.length; i++) {
      if (statusSelect.options[i].value === state.status) {
        statusSelect.selectedIndex = i;
        break;
      }
    }
    document.getElementById('btn-h').textContent = `🏠 ${state.homeName}`;
    document.getElementById('btn-a').textContent = `✈️ ${state.awayName}`;
  }

  function populateAdminSelect() {
    const sel = document.getElementById('adm-match');
    const matchesArray = Object.values(matchesData);
    if (matchesArray.length === 0) {
      sel.innerHTML = '<option value="">— Nessuna partita —</option>';
      return;
    }
    matchesArray.sort((a, b) => extractMatchNumber(a.id) - extractMatchNumber(b.id));
    
    sel.innerHTML = '<option value="">— Seleziona partita —</option>';
    matchesArray.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = `${m.id?.toUpperCase()} · ${m.home?.name} vs ${m.away?.name} (${m.date})`;
      sel.appendChild(opt);
    });
    if (selMatchId) sel.value = selMatchId;
  }

  function startMatchesListener() {
    if (!db) return;
    const matchesRef = ref(db, 'matches');
    onValue(matchesRef, (snapshot) => {
      matchesData = snapshot.val() || {};
      populateAdminSelect();
      if (selMatchId && matchesData[selMatchId]) {
        updateAdminPreview();
      } else if (Object.keys(matchesData).length > 0 && !selMatchId) {
        const sortedIds = Object.keys(matchesData).sort((a,b) => extractMatchNumber(a) - extractMatchNumber(b));
        const firstId = sortedIds[0];
        document.getElementById('adm-match').value = firstId;
        selMatchId = firstId;
        updateAdminPreview();
      }
    }, (err) => {
      console.error('Error reading matches:', err);
      showToast('Errore nel caricamento delle partite', 'err');
    });
  }

  function startResultsListener() {
    if (!db) return;
    const resultsRef = ref(db, 'liveResults');
    onValue(resultsRef, (snapshot) => {
      resultsData = snapshot.val() || {};
      if (selMatchId) updateAdminPreview();
    }, (err) => {
      console.error('Error reading results:', err);
    });
  }

  window.onMatchChange = function() {
    selMatchId = document.getElementById('adm-match').value;
    updateAdminPreview();
  };

  window.pickTeam = function(team) {
    selTeam = team;
    const btnH = document.getElementById('btn-h');
    const btnA = document.getElementById('btn-a');
    if (team === 'home') {
      btnH.classList.add('active');
      btnA.classList.remove('active');
    } else {
      btnA.classList.add('active');
      btnH.classList.remove('active');
    }
  };

  window.addGoal = async function() {
    if (!selMatchId) { showToast('Seleziona una partita', 'err'); return; }
    const scorer = clean(document.getElementById('scorer-in').value, 40);
    if (!scorer) { showToast('Inserisci il nome del marcatore', 'err'); return; }
    const team = selTeam;
    return runExclusive(async () => {
      await updateResult(selMatchId, (s) => {
        const home = [...s.scorersHome];
        const away = [...s.scorersAway];
        (team === 'home' ? home : away).push(scorer);
        let status = s.status;
        if (status === 'In programma' && (home.length + away.length) === 1) status = 'Live';
        return { scorersHome: home, scorersAway: away, status };
      });
      showToast(`⚽ Goal di ${scorer} aggiunto`, 'ok');
      document.getElementById('scorer-in').value = '';
      document.getElementById('scorer-in').focus();
    });
  };

  window.undoGoal = async function() {
    if (!selMatchId) { showToast('Seleziona una partita', 'err'); return; }
    const team = selTeam;
    return runExclusive(async () => {
      let removed = '';
      const tx = await updateResult(selMatchId, (s) => {
        removed = '';
        const home = [...s.scorersHome];
        const away = [...s.scorersAway];
        const list = team === 'home' ? home : away;
        if (list.length === 0) return; // niente da annullare
        removed = list.pop();
        return { scorersHome: home, scorersAway: away, status: s.status };
      });
      if (!tx.committed) { showToast('Nessun goal da annullare per questa squadra', 'err'); return; }
      showToast(`↩️ Annullato goal di ${removed}`, 'inf');
    });
  };

  window.saveStatus = async function() {
    if (!selMatchId) { showToast('Seleziona una partita', 'err'); return; }
    const newStatus = document.getElementById('adm-status').value;
    if (!['In programma', 'Live', 'Finita'].includes(newStatus)) return;
    return runExclusive(async () => {
      await updateResult(selMatchId, (s) => ({ scorersHome: s.scorersHome, scorersAway: s.scorersAway, status: newStatus }));
      showToast(`Stato cambiato in ${newStatus}`, 'ok');
    });
  };

  window.resetMatch = async function() {
    if (!selMatchId) { showToast('Seleziona una partita', 'err'); return; }
    if (!confirm('Resettare la partita cancellerà tutti i goal. Continuare?')) return;
    const id = selMatchId;
    return runExclusive(async () => {
      await writeResult(id, { scorersHome: [], scorersAway: [], status: 'In programma' });
      showToast('Partita resettata', 'inf');
    });
  };

  window.createMatch = async function() {
    const id = document.getElementById('newMatchId').value.trim().toLowerCase();
    const date = document.getElementById('newMatchDate').value;
    const time = document.getElementById('newMatchTime').value.trim();
    const homeName = clean(document.getElementById('newHomeName').value, 40);
    const awayName = clean(document.getElementById('newAwayName').value, 40);
    if (!id || !date || !time || !homeName || !awayName) {
      showToast('Compila tutti i campi', 'err');
      return;
    }
    if (!/^m\d{1,3}$/.test(id)) { showToast('ID non valido: usa "m" + numero (es. m61)', 'err'); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { showToast('Data non valida', 'err'); return; }
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) { showToast('Orario non valido: usa HH:MM (es. 20:10)', 'err'); return; }
    if (matchesData[id]) {
      showToast(`Esiste già una partita con ID ${id}`, 'err');
      return;
    }
    const newMatch = {
      id: id,
      date: date,
      time: time,
      home: { name: homeName, emoji: '⚽' },
      away: { name: awayName, emoji: '⚽' },
      round: 'Fase a Gironi',
      group: ''
    };
    return runExclusive(async () => {
      await set(ref(db, `matches/${id}`), newMatch);
      await writeResult(id, { scorersHome: [], scorersAway: [], status: 'In programma' });
      showToast(`Partita ${id} creata`, 'ok');
      document.getElementById('newMatchId').value = '';
      document.getElementById('newMatchDate').value = '';
      document.getElementById('newMatchTime').value = '';
      document.getElementById('newHomeName').value = '';
      document.getElementById('newAwayName').value = '';
    });
  };

  const ADMIN_EMAILS = new Set([
  "riccardo.costantini.eu@gmail.com",
  "admin@gmail.com"
]);

function isAuthorizedAdmin(user) {
  return (
    !!user?.email &&
    ADMIN_EMAILS.has(
      user.email.toLowerCase()
    )
  );
}

let started = false;

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.replace('admin.html');
    return;
  }


  /*
    Secondo controllo admin.
  */

  if (!isAuthorizedAdmin(user)) {
    try {
      await signOut(auth);
    } catch (e) {
      console.error(e);
    }

    window.location.replace('admin.html');
    return;
  }


  /*
    MFA richiede email verificata.
  */

  if (!user.emailVerified) {
    try {
      await signOut(auth);
    } catch (e) {
      console.error(e);
    }

    window.location.replace('admin.html');
    return;
  }


  /*
    Controlliamo il token Firebase.

    Dopo un login MFA SMS deve esserci:

      firebase.sign_in_second_factor = "phone"
  */

  try {

    const tokenResult =
      await user.getIdTokenResult(true);

    const secondFactor =
      tokenResult?.claims?.firebase
        ?.sign_in_second_factor;


    if (secondFactor !== "phone") {

      console.warn(
        "Accesso dashboard rifiutato: MFA non completata."
      );


      await signOut(auth);

      window.location.replace('admin.html');

      return;
    }

  } catch (error) {

    console.error(
      "Errore controllo MFA:",
      error
    );


    try {
      await signOut(auth);
    } catch (e) {
      console.error(e);
    }


    window.location.replace('admin.html');

    return;
  }


  /*
    Tutti i controlli superati.
  */

  if (started) return;

  started = true;

  db = getDatabase(app);

  document.querySelector(
    '.wrap-admin'
  ).style.visibility = 'visible';

  setConnected(true);

  startMatchesListener();
  startResultsListener();

  document.getElementById(
    'addGoalBtn'
  ).onclick = () =>
    window.addGoal();

  document.getElementById(
    'undoGoalBtn'
  ).onclick = () =>
    window.undoGoal();

  document.getElementById(
    'resetMatchBtn'
  ).onclick = () =>
    window.resetMatch();

  document.getElementById(
    'adm-status'
  ).onchange = () =>
    window.saveStatus();

  document.getElementById(
    'adm-match'
  ).onchange = () =>
    window.onMatchChange();

  document.getElementById(
    'btn-h'
  ).onclick = () =>
    window.pickTeam('home');

  document.getElementById(
    'btn-a'
  ).onclick = () =>
    window.pickTeam('away');

  document.getElementById(
    'createMatchBtn'
  ).onclick = () =>
    window.createMatch();

  document.getElementById(
    'logoutBtn'
  ).onclick = async () => {

    try {
      await signOut(auth);
    } catch (e) {
      console.error(e);
    }

    window.location.replace(
      'admin.html'
    );
  };

  showToast(
    '🔥 Connesso a Firebase',
    'ok'
  );
});
</script>
</body>
</html>
