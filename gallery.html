<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Galleria 3D</title>
<style>
:root{--joy-base:255,255,255;--joy-knob:255,255,255;--bg:#dfe7ee;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--joy-base:255,255,255;--joy-knob:255,255,255;--bg:#1b2027}}
:root[data-theme="dark"]{--joy-base:255,255,255;--joy-knob:255,255,255;--bg:#1b2027}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#joy{display:none;position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;background:rgba(var(--joy-base),.25);border:2px solid rgba(var(--joy-base),.45);touch-action:none;-webkit-tap-highlight-color:transparent}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:rgba(var(--joy-knob),.8);box-shadow:0 2px 8px rgba(0,0,0,.25);transform:translate(-50%,-50%);pointer-events:none}
@media (pointer:coarse){#joy{display:block}}
#cross{display:none;position:fixed;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);pointer-events:none}
#cross::before,#cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.55)}
#cross::before{left:50%;top:0;width:2px;height:100%;margin-left:-1px}
#cross::after{top:50%;left:0;height:2px;width:100%;margin-top:-1px}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%)}
#holo{position:fixed;left:50%;top:50%;width:160px;height:160px;margin:-80px 0 0 -80px;pointer-events:none;opacity:0;transform:scale(1.7);transition:opacity .25s ease,transform .3s cubic-bezier(.2,.9,.3,1);filter:drop-shadow(0 1px 2px rgba(0,0,0,.75))}
body.fps #holo{opacity:1;transform:scale(0.72)}
#holo svg{overflow:visible}
.btn:disabled{opacity:.35;border-style:dashed;filter:grayscale(1)}
#hint{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:8px;background:rgba(10,14,20,.55);color:#cfe;font:500 12px system-ui,sans-serif;pointer-events:none}
@media (pointer:fine){body:not(.locked) #hint{display:block}}
#inv{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5}
.slot{width:76px;height:56px;padding:0;border-radius:10px;border:2px solid rgba(255,255,255,.5);background:rgba(20,24,30,.5);color:#fff;font:600 13px/1.2 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.slot b{font-size:11px;opacity:.7}
.slot.on{border-color:#ffd54a;background:rgba(20,24,30,.78);box-shadow:0 0 0 2px rgba(255,213,74,.35)}
@media (pointer:coarse){#inv{gap:4px}.slot{width:46px;height:46px;font-size:11px}}
body.hands #btnFire{display:none!important}
body.fps canvas{cursor:none}
.btn{display:none;position:fixed;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,24,30,.45);color:#fff;font:600 14px/1 system-ui,sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent}
#btnView{right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(204px + env(safe-area-inset-bottom,0px));width:60px;height:60px}
#btnFire{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:88px;height:88px;background:rgba(200,40,40,.55);font-size:16px}
#btnJump{right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(132px + env(safe-area-inset-bottom,0px));width:60px;height:60px}
@media (pointer:coarse){#btnView,#btnJump{display:block}body.fps #btnFire{display:block}}
</style>
</head>
<body>
<div id="vig"></div>
<div id="joy"><div id="knob"></div></div>
<div id="cross"></div>
<div id="holo"><svg viewBox="0 0 160 160" width="160" height="160" fill="none">
<circle cx="80" cy="80" r="2.4" fill="#ffffff" stroke="#0d0f12" stroke-width="0.8"/>
<circle cx="80" cy="80" r="1.2" fill="#ffffff" stroke="none"/>
</svg></div>
<defs>
<linearGradient id="hwSteel" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#a8adb5"/>
<stop offset="0.35" stop-color="#6b7078"/>
<stop offset="1" stop-color="#2a2d33"/>
</linearGradient>
<linearGradient id="hwPost" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#5a6068"/>
<stop offset="0.5" stop-color="#8a9098"/>
<stop offset="1" stop-color="#5a6068"/>
</linearGradient>
</defs>
<path d="M40 80 L68 80 L68 126 L40 126 Z" fill="url(#hwSteel)" stroke="#0d0f12" stroke-width="1.5"/>
<path d="M92 80 L120 80 L120 126 L92 126 Z" fill="url(#hwSteel)" stroke="#0d0f12" stroke-width="1.5"/>
<rect x="77" y="80" width="6" height="30" fill="url(#hwPost)" stroke="#0d0f12" stroke-width="1.2"/>
<circle cx="80" cy="86" r="1.6" fill="#e8e8e8" opacity="0.9"/>
<line x1="41" y1="81.5" x2="67" y2="81.5" stroke="#c8cdd3" stroke-width="0.8" opacity="0.7"/>
<line x1="93" y1="81.5" x2="119" y2="81.5" stroke="#c8cdd3" stroke-width="0.8" opacity="0.7"/>
<line x1="77.5" y1="81.5" x2="82.5" y2="81.5" stroke="#c8cdd3" stroke-width="0.8" opacity="0.7"/>
</svg></div>
<div id="hint">Clic sulla scena per controllare la visuale · ESC libera il mouse</div>
<div id="inv"><button class="slot" data-i="0" type="button"><b>1</b>Mani</button><button class="slot on" data-i="1" type="button"><b>2</b>Glock</button></div>
<button id="btnView" class="btn" type="button">Vista</button>
<button id="btnFire" class="btn" type="button">Spara</button>
<button id="btnJump" class="btn" type="button">Salta</button>

<script>

    const mat = new THREE.ShaderMaterial({ uniforms: { uScale: U.uScale, uMax: U.uMax, uGrow: { value: c.grow } }, vertexShader: VS, fragmentShader: c.fs, transparent: true, depthWrite: false, blending: c.add ? THREE.AdditiveBlending : THREE.NormalBlending });
    const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; scene.add(pts);
    return dt => {
      for (let i = 0; i < n; i++) {
        life[i] += dt * rate[i]; if (life[i] >= 1) { reset(i); life[i] = 0; }
        const k = i * 3; pos[k] += vel[k] * dt; pos[k + 1] += vel[k + 1] * dt; pos[k + 2] += vel[k + 2] * dt;
      }
      geo.attributes.position.needsUpdate = true; geo.attributes.aLife.needsUpdate = true; geo.attributes.aSize.needsUpdate = true;
    };
  }
  const fireStep = makeFx(burnEm.length * 8, burnEm, { spread: 0.7, drift: 0.5, wind: 0, up: 2.2, life: 0.9, size: 1.6, grow: -0.5, fs: FS_FIRE, add: true });
  const smokeStep = makeFx(burnEm.length * 7, burnEm.map(e => [e[0], e[1] + 0.6, e[2]]), { spread: 0.9, drift: 0.6, wind: 0.5, up: 2.2, life: 5.5, size: 2.2, grow: 2.2, fs: FS_SMOKE, add: false });
  const FS_HAZE = 'varying float vLife; void main(){ float r = length(gl_PointCoord - 0.5) * 2.0; float a = smoothstep(1.0, 0.0, r) * 0.1 * (1.0 - vLife) * smoothstep(0.0, 0.15, vLife); gl_FragColor = vec4(1.0, 0.45, 0.15, a); }';
  const hazeStep = makeFx(burnEm.length * 2, burnEm, { spread: 2.0, drift: 0.3, wind: 0.3, up: 0.5, life: 3, size: 6, grow: 0.8, fs: FS_HAZE, add: true });

  function bloodTex(seed) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'); g.fillStyle = '#4a0709';
    for (let i = 0; i < 5 + seed * 2; i++) { const a = Math.random() * 6.283, d = Math.random() * 30; g.beginPath(); g.arc(64 + Math.cos(a) * d, 64 + Math.sin(a) * d, 8 + Math.random() * 22, 0, 6.283); g.fill(); }
    for (let i = 0; i < 7; i++) { const a = Math.random() * 6.283, d = 40 + Math.random() * 20; g.beginPath(); g.arc(64 + Math.cos(a) * d, 64 + Math.sin(a) * d, 1.5 + Math.random() * 4, 0, 6.283); g.fill(); }
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  }
  const bloodMats = [0, 1, 2].map(i => new THREE.MeshStandardMaterial({ map: bloodTex(i), transparent: true, depthWrite: false, roughness: 0.3, emissive: '#1c0000', polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
  const bloodGeo = new THREE.PlaneGeometry(1, 1);
  [[-9.5, 1.8, 1.5], [-2.2, 0.7, 0.9], [3.5, -1.1, 0.7], [11, -0.6, 1.4], [0.8, 2.6, 0.6], [-16, 0.2, 1.0], [18, 1.5, 0.8],
   [-4.5, -4.4, 0.9], [6.8, -4.8, 0.7], [12.5, -3.9, 1.1], [-18, -4.6, 0.8],
   [-6.5, 5.2, 1.2], [8, 6.0, 0.8], [1.5, 7.0, 0.6], [-1.8, 4.9, 0.7]].forEach(([x, z, sz], i) => {
    const m = new THREE.Mesh(bloodGeo, bloodMats[i % 3]);
    m.rotation.set(-Math.PI / 2, 0, Math.random() * 6.283); m.scale.set(sz, sz * (0.7 + Math.random() * 0.5), 1);
    m.position.set(x, (z < -3.0 || z > 3.5) ? 0.156 : 0.022, z); scene.add(m);
  });

  function nightUpdate(dt) {
    nightT += dt;
    U.uScale.value = renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360));
    U.uMax.value = renderer.domElement.height * 0.22;
    fireStep(dt); smokeStep(dt); hazeStep(dt);
    fireLights.forEach(f => { f.L.intensity = 2.0 * (0.75 + 0.2 * Math.sin(nightT * 13 + f.ph) + 0.12 * Math.sin(nightT * 31 + f.ph * 2) + 0.1 * Math.random()); });
    if (lampLights[2]) lampLights[2].intensity = (Math.sin(nightT * 2.3) > 0.93 || Math.sin(nightT * 17) > 0.97) ? 0.5 : 2.8;
    stars.position.copy(camera.position);
  }

  [skin, shirt, pants].forEach(m => m.emissive.copy(m.color).multiplyScalar(0.12));

  // ---------- Telecamera orbitale e fisica ----------
  blockers.push(wall);
  const fwd = new THREE.Vector3(), back = new THREE.Vector3(), tTarget = new THREE.Vector3(), camRay = new THREE.Raycaster();
  let camDist = 9;
  const HR = CFG.radius;
  function pushOut(p) {
    for (const o of obstacles) {
      if (p.y >= (o.h || 99) - 0.08) continue;
      const dx = p.x - o.x, dz = p.z - o.z, d = Math.hypot(dx, dz), m = o.r + HR;
      if (d < m && d > 0.0001) { p.x = o.x + dx / d * m; p.z = o.z + dz / d * m; }
    }
    for (const b of boxes) {
      if (p.y >= b.top - 0.08) continue;
      const dx = p.x - b.x, dz = p.z - b.z, lx = dx * b.c - dz * b.s, lz = dx * b.s + dz * b.c;
      const ex = lx - Math.max(-b.hx, Math.min(b.hx, lx)), ez = lz - Math.max(-b.hz, Math.min(b.hz, lz)), d2 = ex * ex + ez * ez;
      if (d2 >= HR * HR) continue;
      let px, pz;
      if (d2 > 1e-6) { const d = Math.sqrt(d2), k = (HR - d) / d; px = ex * k; pz = ez * k; }
      else if (b.hx - Math.abs(lx) < b.hz - Math.abs(lz)) { px = Math.sign(lx || 1) * (b.hx - Math.abs(lx) + HR); pz = 0; }
      else { px = 0; pz = Math.sign(lz || 1) * (b.hz - Math.abs(lz) + HR); }
      p.x += px * b.c + pz * b.s; p.z += -px * b.s + pz * b.c;
    }
  }
  function groundAt(x, z, y) {
    let g = (z < -3.0 || z > 3.5) ? 0.15 : 0;
    for (const o of obstacles) if (o.h && o.h > g && y >= o.h - 0.12 && Math.hypot(x - o.x, z - o.z) <= o.r + 0.1) g = o.h;
    for (const b of boxes) {
      if (b.top <= g || y < b.top - 0.12) continue;
      const dx = x - b.x, dz = z - b.z;
      if (Math.abs(dx * b.c - dz * b.s) <= b.hx + 0.25 && Math.abs(dx * b.s + dz * b.c) <= b.hz + 0.25) g = b.top;
    }
    return g;
  }

  let shadowFlip = false, shadowDirty = true;
  function perfUpdate(moving) {
    if (moving) shadowDirty = true;
    shadowFlip = !shadowFlip;
    if (shadowFlip && shadowDirty) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; }
  }

  let camK = 1;
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camK = Math.min(2.2, Math.max(1, 0.9 / camera.aspect));
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  addEventListener('orientationchange', resize);
  resize();

  // ---------- Loop ----------
  const clock = new THREE.Clock();
  const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
  const tPos = new THREE.Vector3(), tLook = new THREE.Vector3();
  const minX = -CFG.floorW / 2 + CFG.radius, maxX = CFG.floorW / 2 - CFG.radius;
  const minZ = wallFront + CFG.radius, maxZ = CFG.wallZ + CFG.floorD - CFG.radius;
  let phase = 0, amp = 0, yaw = Math.PI, first = true;

  const lastCamPos = new THREE.Vector3(1e9, 1e9, 1e9), lastFwd = new THREE.Vector3();
  let lastCamDist = 0;
  let lastYawShadow = yaw;

  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);

    let ix = (keys.d ? 1 : 0) - (keys.a ? 1 : 0) + joy.x;
    let iz = (keys.s ? 1 : 0) - (keys.w ? 1 : 0) + joy.y;
    let len = Math.hypot(ix, iz);
    if (len < 0.1) { ix = iz = len = 0; }
    else if (len > 1) { ix /= len; iz /= len; len = 1; }

    if (len > 0) {
      const c = Math.cos(aimYaw), sn = Math.sin(aimYaw), rx = c * ix + sn * iz;
      iz = -sn * ix + c * iz; ix = rx;
    }

    if (len > 0) {
      hero.position.x = Math.min(maxX, Math.max(minX, hero.position.x + ix * CFG.speed * dt));
      hero.position.z = Math.min(maxZ, Math.max(minZ, hero.position.z + iz * CFG.speed * dt));
      pushOut(hero.position);
      hero.position.x = Math.min(maxX, Math.max(minX, hero.position.x));
      hero.position.z = Math.min(maxZ, Math.max(minZ, hero.position.z));
      const target = Math.atan2(ix, iz);
      let d = target - yaw;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      yaw += d * Math.min(1, dt * 12);
      model.rotation.y = yaw;
      phase += dt * CFG.speed * len * 2.4;
    }

    if (fps) { yaw = aimYaw + Math.PI; model.rotation.y = yaw; }

    const gy = groundAt(hero.position.x, hero.position.z, hero.position.y);
    if (jumpReq && !airborne) { vy = 7.8; airborne = true; }
    jumpReq = false;
    if (airborne) {
      vy -= 22 * dt; hero.position.y += vy * dt;
      if (hero.position.y <= gy && vy <= 0) { hero.position.y = gy; vy = 0; airborne = false; }
    } else if (hero.position.y > gy + 0.2) airborne = true;
    else hero.position.y += (gy - hero.position.y) * Math.min(1, dt * 20);

    amp += (len - amp) * Math.min(1, dt * 10);
    const s = Math.sin(phase) * amp * 0.8;
    legL.rotation.x = s; legR.rotation.x = -s;
    holdT += ((slot === 1 ? 1 : 0) - holdT) * Math.min(1, dt * 10);

    // --- Animazione braccia ---
    // Sinistro: cammina normalmente, non si alza mai (per la pistola sta in basso)
    armL.rotation.set(s, 0, 0);
    // Destro: oscilla col cammino (holdT=0), si alza a mirare (holdT=1)
    armR.rotation.set(-s + (-Math.PI / 2 + s) * holdT, 0, 0);

    // Pistola visibile in terza persona solo quando è impugnata
    tpsGun.visible = holdT > 0.5;
    tpsGun.position.y = 1.50 + Math.abs(Math.sin(phase)) * amp * 0.02;


    // Camera terza persona
    qF.setFromEuler(eul.set(aimPitch, aimYaw, 0, 'YXZ'));
    fwd.set(0, 0, -1).applyQuaternion(qF);
    tTarget.set(hero.position.x, hero.position.y + 2.2, hero.position.z);
    if (first) { camPos.copy(tTarget); first = false; }
    camPos.lerp(tTarget, 1 - Math.exp(-10 * dt));
    camZoomS += (camBase - camZoomS) * (1 - Math.exp(-12 * dt));

    const wantedDist = camZoomS * camK;
    const camMoved = camPos.distanceToSquared(lastCamPos) > 1e-6
                  || fwd.dot(lastFwd) < 0.9999
                  || Math.abs(wantedDist - lastCamDist) > 0.02;
    if (camMoved) {
      camRay.set(camPos, back.copy(fwd).negate()); camRay.far = wantedDist + 0.4;
      const camHit = camRay.intersectObjects(blockers, true)[0];
      lastCamDist = camHit ? Math.max(1.0, camHit.distance - 0.4) : wantedDist;
      lastCamPos.copy(camPos); lastFwd.copy(fwd);
    }
    camDist = lastCamDist;
    camera.position.copy(camPos).addScaledVector(fwd, -camDist);
    if (camera.position.y < 0.4) camera.position.y = 0.4;
    camera.quaternion.copy(qF);

    // Transizione FPS
    const goal = fps ? 1 : 0;
    fpsT += (goal - fpsT) * Math.min(1, dt * 6);
    if (Math.abs(goal - fpsT) < 0.002) fpsT = goal;
    if (fpsT > 0) {
      const e = fpsT * fpsT * (3 - 2 * fpsT);
      qT.copy(camera.quaternion);
      qF.setFromEuler(eul.set(aimPitch, aimYaw, 0, 'YXZ'));
      eye.set(hero.position.x - Math.sin(aimYaw) * 0.15, hero.position.y + 1.8, hero.position.z - Math.cos(aimYaw) * 0.15);
      camera.position.lerp(eye, e);
      camera.quaternion.copy(qT).slerp(qF, e);
      camera.fov = 50 + 15 * e; camera.updateProjectionMatrix();
    } else if (camera.fov !== 50) { camera.fov = 50; camera.updateProjectionMatrix(); }
    model.visible = fpsT < 0.85; viewGun.visible = fpsT > 0.85 && slot === 1; viewHands.visible = fpsT > 0.85 && slot === 0;

    recoil *= Math.exp(-dt * 14); flash = Math.max(0, flash - dt);
    // Glock in prima persona: in basso a destra, con la sola mano destra visibile
    viewGun.position.set(0.16, -0.17, -0.40 + recoil * 0.05);
    viewGun.rotation.set(recoil * 0.15, Math.PI, 0);
    muzzle.visible = flash > 0;
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i]; f.age += dt;
      const k = f.age / 0.35;
      f.mesh.scale.setScalar(1 + k * 4); f.mesh.material.opacity = Math.max(0, 1 - k);
      if (k >= 1) { scene.remove(f.mesh); f.mesh.material.dispose(); fx.splice(i, 1); }
    }

    const yawDelta = Math.abs(yaw - lastYawShadow);
    const shadowNeedsUpdate = len > 0 || airborne || yawDelta > 0.005;
    if (shadowNeedsUpdate) lastYawShadow = yaw;
    perfUpdate(shadowNeedsUpdate);

    nightUpdate(dt);
    renderer.render(scene, camera);
  }
  renderer.setAnimationLoop(frame);

  // ---------- Cleanup ----------
  addEventListener('pagehide', () => {
    renderer.setAnimationLoop(null);
    scene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    renderer.dispose();
  });
})();
</script>
</body>
</html>
