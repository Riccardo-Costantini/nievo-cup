<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Galleria 3D</title>
<style>
:root{--joy-base:255,255,255;--joy-knob:255,255,255;--bg:#dfe7ee;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--joy-base:255,255,255;--joy-knob:255,255,255;--bg:#1b2027}}
:root[data-theme="dark"]{--joy-base:255,255,255;--joy-knob:255,255,255;--bg:#1b2027}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#joy{display:none;position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;background:rgba(var(--joy-base),.25);border:2px solid rgba(var(--joy-base),.45);touch-action:none;-webkit-tap-highlight-color:transparent}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:rgba(var(--joy-knob),.8);box-shadow:0 2px 8px rgba(0,0,0,.25);transform:translate(-50%,-50%);pointer-events:none}
@media (pointer:coarse){#joy{display:block}}
</style>
</head>
<body>
<div id="joy"><div id="knob"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ---------- Configurazione ----------
  const CFG = {
    speed: 4, radius: 0.4, wallZ: -6, wallDepth: 0.5, wallW: 20, wallH: 6.6,
    floorW: 20, floorD: 16, img: 1.6, gap: 0.3, url: 'https://www.google.com'
  };
  const wallFront = CFG.wallZ + CFG.wallDepth / 2;
  const coarse = matchMedia('(pointer:coarse)').matches;

  // ---------- Renderer / scena / camera ----------
  const renderer = new THREE.WebGLRenderer({ antialias: !coarse, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#bfd9ef');
  scene.fog = new THREE.Fog('#bfd9ef', 45, 120);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);

  scene.add(new THREE.HemisphereLight(0xcfe6ff, 0xa89f8c, 0.9));
  const sun = new THREE.DirectionalLight(0xfff1d6, 0.95);
  sun.position.set(6, 12, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(coarse ? 1024 : 2048, coarse ? 1024 : 2048);
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 40 });
  sun.shadow.radius = 4;
  sun.shadow.bias = -0.0005;
  scene.add(sun);

  // ---------- Pavimento e muro ----------
  // ---------- Ambiente: strada, marciapiedi, giardino, palazzo (riferimento: foto Street View) ----------
  const obstacles = [];                               // ostacoli circolari {x, z, r}
  const M = (c, r = 0.9) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
  const unit = new THREE.BoxGeometry(1, 1, 1), dm = new THREE.Object3D();
  const B = (w, h, d, mat, x, y, z) => {
    const m = new THREE.Mesh(unit, mat); m.scale.set(w, h, d); m.position.set(x, y, z);
    m.receiveShadow = true; scene.add(m); return m;
  };
  const inst = (geo, mat, list, shadow) => {
    const m = new THREE.InstancedMesh(geo, mat, list.length);
    list.forEach((a, i) => { dm.position.set(a[0], a[1], a[2]); dm.scale.set(a[3], a[4], a[5]); dm.updateMatrix(); m.setMatrixAt(i, dm.matrix); });
    m.frustumCulled = false; m.castShadow = !!shadow; scene.add(m); return m;
  };
  function tex(base, tile, rx, ry) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0, 0, 128, 128);
    for (let i = 0; i < 1200; i++) { g.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,.10)' : 'rgba(255,255,255,.08)'; g.fillRect(Math.random() * 128, Math.random() * 128, 2, 2); }
    if (tile) { g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 2; g.strokeRect(0, 0, 128, 128); }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.encoding = THREE.sRGBEncoding; return t;
  }
  const tm = (base, tile, rx, ry) => new THREE.MeshStandardMaterial({ map: tex(base, tile, rx, ry), roughness: 1 });

  // prato (si estende fino all'orizzonte) e strada: 2 corsie da 3 m, z da -2.75 a 3.25
  const gnd = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), M('#6f9a4f', 1));
  gnd.rotation.x = -Math.PI / 2; gnd.position.y = -0.02; gnd.receiveShadow = true; scene.add(gnd);
  B(80, 0.02, 6, tm('#585b60', false, 20, 2), 0, 0, 0.25);
  B(80, 0.15, 3.8, tm('#bdb9b0', true, 80, 4), 0, 0.075, -4.9);      // marciapiede lato muro (rialzato 15 cm)
  B(80, 0.15, 8.5, tm('#bdb9b0', true, 80, 8), 0, 0.075, 7.75);      // marciapiede opposto
  const curb = M('#cfcfca');
  B(80, 0.18, 0.25, curb, 0, 0.09, -2.875); B(80, 0.18, 0.25, curb, 0, 0.09, 3.375);  // cordoli
  const white = M('#f2f2ee', 0.8), dashes = [], zebra = [];
  for (let x = -38; x <= 38; x += 4) if (Math.abs(x - 6) > 3.5) dashes.push([x, 0.015, 0.25, 1.6, 0.01, 0.14]);
  for (let i = 0; i < 8; i++) zebra.push([6 + (i - 3.5) * 0.9, 0.015, 0.25, 0.45, 0.01, 5]);
  inst(unit, white, dashes.concat(zebra, [[0, 0.015, -2.5, 80, 0.01, 0.12], [0, 0.015, 3.0, 80, 0.01, 0.12]]));

  // palazzo condominiale (blocchi arancione/ocra, vano scala beige, ala grigio chiaro, torre rosata sullo sfondo)
  const FH = 2.9, wf = [], wg = [], sl = [], pr = [];
  function building(x0, x1, color, zf, floors, cols, fw, fh, bal) {
    const w = x1 - x0, h = floors * FH, d = 10, cx = (x0 + x1) / 2;
    B(w, h, d, M(color), cx, h / 2, zf - d / 2);
    B(w + 0.3, 0.3, d + 0.3, M('#6b6b6b'), cx, h + 0.15, zf - d / 2);   // tetto
    B(w + 0.06, 1.0, d + 0.06, M('#c9bfa8'), cx, 0.5, zf - d / 2);       // basamento beige
    for (let f = 0; f < floors; f++) for (let c = 0; c < cols; c++) {
      const x = x0 + (c + 0.5) * w / cols, y = f * FH + 2.0;
      wf.push([x, y, zf + 0.04, fw, fh, 0.12]); wg.push([x, y, zf + 0.08, fw - 0.3, fh - 0.3, 0.1]);
      if (bal && f > 0 && (f + c) % 3 === 0) {                           // balcone: soletta + parapetto
        sl.push([x, y - fh / 2 - 0.05, zf + 0.35, fw + 0.6, 0.12, 0.8]);
        pr.push([x, y - fh / 2 + 0.4, zf + 0.72, fw + 0.6, 0.85, 0.08]);
      }
    }
  }
  building(-16, -3, '#d9904f', -14, 6, 5, 1.2, 1.4, true);
  building(3, 14, '#dc9a58', -14, 6, 4, 1.2, 1.4, true);
  building(14, 26, '#dedcd6', -14, 6, 4, 1.2, 1.4, false);
  building(-3, 3, '#cdc7b8', -13.2, 6, 2, 0.9, 2.0, false);
  building(-36, -24, '#d89a8c', -20, 8, 4, 1.0, 1.3, true);
  inst(unit, M('#ece9e2'), wf); inst(unit, M('#4a5a68', 0.3), wg);
  inst(unit, M('#d8d5ce'), sl); inst(unit, M('#e4e1da'), pr);
  B(1.6, 2.2, 0.1, M('#2b3036', 0.4), 0, 1.1, -13.15);                   // portone
  B(3.2, 0.15, 1.4, curb, 0, 2.45, -12.5);                               // pensilina

  // recinzione metallica scura con cancello pedonale centrale e vialetto
  const iron = M('#2a2d30', 0.5), bars = [];
  B(21.1, 0.45, 0.25, curb, -11.45, 0.225, -7); B(21.1, 0.45, 0.25, curb, 11.45, 0.225, -7);
  B(0.4, 1.9, 0.4, curb, -1.05, 0.95, -7); B(0.4, 1.9, 0.4, curb, 1.05, 0.95, -7);
  for (let x = -22; x <= 22; x += 0.22) if (Math.abs(x) > 1.3) bars.push([x, 1.1, -7, 0.04, 1.3, 0.04]);
  for (let x = -0.8; x <= 0.81; x += 0.16) bars.push([x, 1.0, -7, 0.035, 1.7, 0.035]);
  inst(unit, iron, bars, true);
  B(44, 0.05, 0.05, iron, 0, 1.65, -7); B(44, 0.05, 0.05, iron, 0, 0.8, -7);
  B(1.7, 0.05, 0.05, iron, 0, 1.8, -7); B(1.7, 0.05, 0.05, iron, 0, 0.3, -7);
  B(1.6, 0.03, 7, M('#b4684f'), 0, 0.015, -10.5);                         // vialetto verso l'ingresso

  // alberi e arbusti
  const trees = [[-14, -9.5], [-9, -10.5], [-6, -8.5], [6.5, -9], [10, -10.5], [15, -9]], can = [];
  trees.forEach(([x, z]) => can.push([x, 4.6, z, 2.2, 2.0, 2.2], [x + 1, 4.0, z + 0.4, 1.6, 1.5, 1.6], [x - 0.9, 4.2, z - 0.4, 1.7, 1.6, 1.7]));
  inst(new THREE.CylinderGeometry(0.2, 0.3, 1, 6), M('#6b4a2f'), trees.map(([x, z]) => [x, 1.6, z, 1, 3.2, 1]), true);
  inst(new THREE.IcosahedronGeometry(1, 1), M('#4f8a3c'), can, true);
  inst(new THREE.IcosahedronGeometry(0.5, 1), M('#5b9a45'),
    [[-1.6, -8.5], [1.6, -8.5], [-3.2, -9], [3.2, -9], [-8, -8.4], [8, -8.4], [12, -8.4]].map(([x, z]) => [x, 0.4, z, 1.6, 1.4, 1.6]), true);

  // idranti rossi (~0,9 m) e lampione sul marciapiede
  const red = M('#c0262d', 0.5);
  function hydrant(x, z) {
    const g = new THREE.Group();
    const part = (geo, y, rz) => { const m = new THREE.Mesh(geo, red); m.position.y = y; if (rz) m.rotation.z = rz; m.castShadow = true; g.add(m); };
    part(new THREE.CylinderGeometry(0.17, 0.17, 0.06, 10), 0.18);
    part(new THREE.CylinderGeometry(0.12, 0.14, 0.6, 10), 0.48);
    part(new THREE.SphereGeometry(0.13, 10, 6, 0, 6.283, 0, 1.571), 0.78);
    part(new THREE.CylinderGeometry(0.05, 0.05, 0.36, 8), 0.55, Math.PI / 2);
    part(new THREE.CylinderGeometry(0.035, 0.035, 0.08, 8), 0.93);
    g.position.set(x, 0, z); scene.add(g);
  }
  [[-6, -3.5], [6.5, -3.5], [-2.5, 4.4]].forEach(([x, z]) => { hydrant(x, z); obstacles.push({ x, z, r: 0.18 }); });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 5.4, 8), M('#3b4046', 0.5));
  pole.position.set(2.2, 2.85, -3.45); pole.castShadow = true; scene.add(pole);
  B(0.07, 0.07, 1.2, M('#3b4046', 0.5), 2.2, 5.5, -2.9); B(0.5, 0.12, 0.3, M('#f5f1e0'), 2.2, 5.45, -2.4);
  obstacles.push({ x: 2.2, z: -3.45, r: 0.12 });

  const wall = new THREE.Mesh(new THREE.BoxGeometry(CFG.wallW, CFG.wallH, CFG.wallDepth),
    new THREE.MeshStandardMaterial({ color: '#d9dee4', roughness: 0.95 }));
  wall.position.set(0, CFG.wallH / 2, CFG.wallZ);
  wall.castShadow = wall.receiveShadow = true;
  scene.add(wall);

  // ---------- 9 immagini placeholder (generate via canvas, nessuna risorsa esterna) ----------
  function makeTexture(i) {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d'), h = i * 40;
    const grad = g.createLinearGradient(0, 0, 256, 256);
    grad.addColorStop(0, `hsl(${h},70%,62%)`);
    grad.addColorStop(1, `hsl(${h + 40},70%,38%)`);
    g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
    g.fillStyle = 'rgba(255,255,255,.22)';
    g.beginPath();
    if (i % 3 === 0) g.arc(170, 90, 70, 0, Math.PI * 2);
    else if (i % 3 === 1) g.rect(100, 20, 130, 130);
    else { g.moveTo(170, 20); g.lineTo(240, 150); g.lineTo(100, 150); g.closePath(); }
    g.fill();
    g.fillStyle = '#fff'; g.font = 'bold 120px sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(i + 1), 128, 150);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    return t;
  }
  const frames = [];
  const frameGeo = new THREE.BoxGeometry(CFG.img + 0.2, CFG.img + 0.2, 0.06);
  const planeGeo = new THREE.PlaneGeometry(CFG.img, CFG.img);
  const frameMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.6 });
  const step = CFG.img + CFG.gap, cy = CFG.wallH / 2;
  for (let i = 0; i < 9; i++) {
    const col = i % 3, row = Math.floor(i / 3);
    const x = (col - 1) * step, y = cy + (1 - row) * step;
    const frame = new THREE.Mesh(frameGeo, frameMat);
    frame.position.set(x, y, wallFront + 0.03);
    frame.castShadow = true;
    const pic = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ map: makeTexture(i) }));
    pic.position.set(x, y, wallFront + 0.07);
    pic.userData.index = i + 1;
    scene.add(frame, pic);
    frames.push(pic);
  }

  // ---------- Personaggio voxel ----------
  const skin = new THREE.MeshStandardMaterial({ color: '#f1c27d', roughness: 0.9 });
  const shirt = new THREE.MeshStandardMaterial({ color: '#3b82f6', roughness: 0.9 });
  const pants = new THREE.MeshStandardMaterial({ color: '#374151', roughness: 0.9 });
  const dark = new THREE.MeshStandardMaterial({ color: '#1f2937' });
  const part = (w, h, d, mat, x, y, z) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z); m.castShadow = true; return m;
  };
  const limb = (w, h, d, mat, x, y) => {           // pivot all'articolazione
    const p = new THREE.Group(); p.position.set(x, y, 0);
    p.add(part(w, h, d, mat, 0, -h / 2, 0)); return p;
  };
  const hero = new THREE.Group();
  const model = new THREE.Group();                  // fronte del modello verso +Z locale
  const legL = limb(0.24, 0.75, 0.26, pants, -0.14, 0.75);
  const legR = limb(0.24, 0.75, 0.26, pants, 0.14, 0.75);
  const armL = limb(0.2, 0.7, 0.22, skin, -0.4, 1.5);
  const armR = limb(0.2, 0.7, 0.22, skin, 0.4, 1.5);
  const head = part(0.52, 0.52, 0.52, skin, 0, 1.76, 0);
  head.add(part(0.08, 0.08, 0.02, dark, -0.12, 0.04, 0.26), part(0.08, 0.08, 0.02, dark, 0.12, 0.04, 0.26));
  model.add(part(0.56, 0.75, 0.32, shirt, 0, 1.125, 0), head, legL, legR, armL, armR);
  hero.add(model);
  hero.position.set(0, 0, 5);
  model.rotation.y = Math.PI;                       // all'inizio guarda il muro
  scene.add(hero);

  // ---------- Input ----------
  const keys = {};
  const map = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd' };
  addEventListener('keydown', e => { if (map[e.code]) { keys[map[e.code]] = true; e.preventDefault(); } });
  addEventListener('keyup', e => { if (map[e.code]) keys[map[e.code]] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  const joy = { x: 0, y: 0 };
  const base = document.getElementById('joy'), knob = document.getElementById('knob');
  let joyId = null;
  function joyMove(e) {
    const r = base.getBoundingClientRect(), max = r.width / 2 - 27;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy);
    if (d > max) { dx *= max / d; dy *= max / d; }
    knob.style.transform = `translate(-50%,-50%) translate(${dx}px,${dy}px)`;
    joy.x = dx / max; joy.y = dy / max;
  }
  function joyEnd(e) {
    if (e.pointerId !== joyId) return;
    joyId = null; joy.x = joy.y = 0;
    knob.style.transform = 'translate(-50%,-50%)';
  }
  base.addEventListener('pointerdown', e => {
    if (joyId !== null) return;
    joyId = e.pointerId; base.setPointerCapture(joyId); joyMove(e); e.preventDefault();
  });
  base.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
  base.addEventListener('pointerup', joyEnd);
  base.addEventListener('pointercancel', joyEnd);
  base.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  // ---------- Raycasting sulle immagini ----------
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  renderer.domElement.addEventListener('click', e => {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (ray.intersectObjects(frames, false).length) window.open(CFG.url, '_blank', 'noopener');
  });

  // ---------- Resize ----------
  let camK = 1;
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camK = Math.min(2.2, Math.max(1, 0.9 / camera.aspect)); // in verticale la camera si allontana
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  addEventListener('orientationchange', resize);
  resize();

  // ---------- Loop ----------
  const clock = new THREE.Clock();
  const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
  const tPos = new THREE.Vector3(), tLook = new THREE.Vector3();
  const minX = -CFG.floorW / 2 + CFG.radius, maxX = CFG.floorW / 2 - CFG.radius;
  const minZ = wallFront + CFG.radius, maxZ = CFG.wallZ + CFG.floorD - CFG.radius;
  let phase = 0, amp = 0, yaw = Math.PI, first = true;

  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);

    // direzione: tastiera + joystick, normalizzata (velocità costante in diagonale)
    let ix = (keys.d ? 1 : 0) - (keys.a ? 1 : 0) + joy.x;
    let iz = (keys.s ? 1 : 0) - (keys.w ? 1 : 0) + joy.y;
    let len = Math.hypot(ix, iz);
    if (len < 0.1) { ix = iz = len = 0; }
    else if (len > 1) { ix /= len; iz /= len; len = 1; }

    // movimento con collisioni risolte per asse (scorrimento lungo il muro)
    if (len > 0) {
      hero.position.x = Math.min(maxX, Math.max(minX, hero.position.x + ix * CFG.speed * dt));
      hero.position.z = Math.min(maxZ, Math.max(minZ, hero.position.z + iz * CFG.speed * dt));
      for (const o of obstacles) {                     // idranti e lampione: spinta fuori dall'ostacolo
        const dx = hero.position.x - o.x, dz = hero.position.z - o.z, d = Math.hypot(dx, dz), m = o.r + CFG.radius;
        if (d < m && d > 0) { hero.position.x = o.x + dx / d * m; hero.position.z = o.z + dz / d * m; }
      }
      hero.position.x = Math.min(maxX, Math.max(minX, hero.position.x));
      hero.position.z = Math.min(maxZ, Math.max(minZ, hero.position.z));
      const target = Math.atan2(ix, iz);
      let d = target - yaw;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      yaw += d * Math.min(1, dt * 12);
      model.rotation.y = yaw;
      phase += dt * CFG.speed * len * 2.4;
    }

    // salita/discesa del marciapiede rialzato (15 cm)
    const gy = (hero.position.z < -3.0 || hero.position.z > 3.5) ? 0.15 : 0;
    hero.position.y += (gy - hero.position.y) * Math.min(1, dt * 20);

    // animazione camminata
    amp += (len - amp) * Math.min(1, dt * 10);
    const s = Math.sin(phase) * amp * 0.8;
    legL.rotation.x = s; legR.rotation.x = -s;
    armL.rotation.x = -s; armR.rotation.x = s;

    // telecamera in terza persona, fluida
    tPos.set(hero.position.x, 4.5 * camK, hero.position.z + 8.5 * camK);
    tLook.set(hero.position.x, 2.5, hero.position.z - 6);
    if (first) { camPos.copy(tPos); camLook.copy(tLook); first = false; }
    const k = 1 - Math.exp(-4 * dt);
    camPos.lerp(tPos, k); camLook.lerp(tLook, k);
    camera.position.copy(camPos);
    camera.lookAt(camLook);

    renderer.render(scene, camera);
  }
  renderer.setAnimationLoop(frame);

  // ---------- Ciclo di vita ----------
  addEventListener('pagehide', () => {
    renderer.setAnimationLoop(null);
    scene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
    renderer.dispose();
  });
})();
</script>
</body>
</html>
